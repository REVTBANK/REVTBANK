<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVTbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#060b16;
    --navy-900:#0c1526;
    --navy-800:#121f38;
    --navy-700:#1a2c4d;
    --blue-500:#2f6fed;
    --blue-400:#5089ff;
    --silver:#c9d3e0;
    --silver-dim:#8695ac;
    --gold:#e8b84b;
    --white:#f4f7fb;
    --green:#25c987;
    --red:#f0555a;
    --amber:#e8a23a;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, #14274a 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, #0f2038 0%, transparent 55%),
      var(--navy-950);
    color:var(--white);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

  /* ---------- Shared bits ---------- */
  .screen{padding:22px 20px 100px; animation:fade .35s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .brand-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .crest{width:34px; height:34px; flex-shrink:0;}
  .brand{font-size:20px; font-weight:700; letter-spacing:.2px;}
  .brand b{color:var(--blue-400);}
  .tagline{color:var(--silver-dim); font-size:12.5px; margin-top:2px;}

  .card-surface{
    background:linear-gradient(155deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(255,255,255,.06);
    border-radius:var(--radius);
    padding:18px;
  }

  label{display:block; font-size:12.5px; color:var(--silver-dim); margin:14px 0 6px;}
  input, select{
    width:100%; padding:13px 14px; border-radius:10px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04); color:var(--white); font-size:15px;
    font-family:inherit;
  }
  input::placeholder{color:#5c6a83;}
  input:focus, select:focus{outline:2px solid var(--blue-500); border-color:transparent;}

  .btn{
    width:100%; padding:14px; border-radius:11px; border:none;
    font-size:15px; font-weight:600; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{background:linear-gradient(135deg, var(--blue-400), var(--blue-500)); color:white;}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:transparent; border:1px solid rgba(255,255,255,.15); color:var(--white);}
  .btn-danger{background:rgba(240,85,90,.15); color:var(--red); border:1px solid rgba(240,85,90,.3);}
  .btn-sm{padding:9px 12px; font-size:13px; border-radius:8px; width:auto;}
  .link{color:var(--blue-400); text-decoration:none; font-size:13.5px; cursor:pointer;}
  .muted{color:var(--silver-dim); font-size:13px;}
  .error-box{background:rgba(240,85,90,.12); border:1px solid rgba(240,85,90,.3); color:#ff9a9d; padding:10px 12px; border-radius:9px; font-size:13.5px; margin-top:12px;}
  .success-box{background:rgba(37,201,135,.12); border:1px solid rgba(37,201,135,.3); color:#7de8bc; padding:10px 12px; border-radius:9px; font-size:13.5px; margin-top:12px;}

  .steps{display:flex; gap:6px; margin:18px 0 22px;}
  .steps div{flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.08);}
  .steps div.done{background:var(--blue-400);}

  .tabs{display:flex; background:rgba(255,255,255,.05); border-radius:11px; padding:4px; margin-bottom:20px;}
  .tabs button{flex:1; padding:10px; border:none; background:transparent; color:var(--silver-dim); border-radius:8px; font-family:inherit; font-weight:600; font-size:13.5px; cursor:pointer;}
  .tabs button.active{background:var(--blue-500); color:white;}

  /* ---------- Landing / auth ---------- */
  .hero{text-align:center; padding:36px 0 8px;}
  .hero .crest-big{width:76px; height:76px; margin:0 auto 14px;}
  .hero h1{font-size:26px;}
  .hero p{color:var(--silver-dim); font-size:13.5px; margin-top:6px;}

  /* ---------- Dashboard ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .greet{font-size:13px; color:var(--silver-dim);}
  .greet b{color:var(--white);}
  .avatar{width:38px; height:38px; border-radius:50%; background:var(--navy-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; border:1px solid rgba(255,255,255,.1); cursor:pointer; background-size:cover; background-position:center; overflow:hidden;}

  .photo-frame{width:140px; height:140px; border-radius:50%; margin:14px auto 0; background:rgba(255,255,255,.04); border:2px dashed rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .photo-frame img{width:100%; height:100%; object-fit:cover;}
  .photo-frame-lg{width:100%; height:260px; border-radius:16px; margin:8px 0 0; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .photo-frame-lg img{width:100%; height:100%; object-fit:cover;}
  .doc-frame{width:100%; height:130px; border-radius:12px; background:rgba(255,255,255,.04); border:2px dashed rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-top:8px; cursor:pointer;}
  .doc-frame img{width:100%; height:100%; object-fit:cover;}
  .doc-frame-lg{width:100%; height:220px; border-radius:14px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; margin-top:10px;}
  .doc-frame-lg img{width:100%; height:100%; object-fit:contain; background:#000;}
  .frame-empty{display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--silver-dim); font-size:11.5px;}
  .frame-ic{font-size:26px;}
  .profile-photo{width:64px; height:64px; border-radius:50%; background:var(--navy-700); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; margin:0 auto 12px; background-size:cover; background-position:center;}

  .balance-card{background:linear-gradient(135deg,#173058,#0d1a30); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:22px; margin-bottom:18px;}
  .balance-card .label{font-size:12.5px; color:var(--silver-dim);}
  .balance-card .amount{font-size:30px; font-weight:700; margin-top:6px; font-family:'Space Grotesk',sans-serif;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; padding:3px 9px; border-radius:20px; font-weight:600;}
  .badge-green{background:rgba(37,201,135,.15); color:var(--green);}
  .badge-amber{background:rgba(232,162,58,.15); color:var(--amber);}
  .badge-red{background:rgba(240,85,90,.15); color:var(--red);}
  .badge-gold{background:rgba(232,184,75,.18); color:var(--gold);}

  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px;}
  .action{background:var(--navy-800); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:12px 6px; text-align:center; cursor:pointer;}
  .action .ic{width:30px; height:30px; margin:0 auto 6px; display:flex; align-items:center; justify-content:center; background:rgba(80,137,255,.15); border-radius:9px;}
  .action span{font-size:10.5px; color:var(--silver); display:block; line-height:1.2;}

  .section-title{font-size:14px; font-weight:600; margin:22px 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .op-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.05);}
  .op-left{display:flex; align-items:center; gap:10px;}
  .op-ic{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .op-name{font-size:13.5px; font-weight:500;}
  .op-date{font-size:11px; color:var(--silver-dim);}
  .op-amount{font-weight:600; font-size:13.5px;}

  .bottom-nav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:rgba(10,17,32,.92); backdrop-filter:blur(10px); border-top:1px solid rgba(255,255,255,.07); display:flex; padding:8px 4px 14px;}
  .nav-item{flex:1; text-align:center; background:none; border:none; color:var(--silver-dim); font-family:inherit; font-size:10.5px; cursor:pointer; padding:6px 0;}
  .nav-item.active{color:var(--blue-400);}
  .nav-item .nic{font-size:18px; display:block; margin-bottom:2px;}

  /* Visa card */
  .visa-card{border-radius:16px; padding:20px; height:170px; position:relative; display:flex; flex-direction:column; justify-content:space-between; color:white; overflow:hidden; box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .visa-card.standard{background:linear-gradient(135deg,#22385f,#0b1526);}
  .visa-card.silver{background:linear-gradient(135deg,#8f9bb0,#3d4a5f); color:#0c1526;}
  .visa-card.black{background:linear-gradient(135deg,#1a1a1e,#000);}
  .visa-card::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);}
  .visa-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .visa-num{font-size:17px; letter-spacing:2px; font-family:'Space Grotesk',sans-serif;}
  .visa-bottom{display:flex; justify-content:space-between; align-items:flex-end; font-size:11.5px;}
  .chip{width:34px; height:26px; border-radius:5px; background:linear-gradient(135deg,#e8c76a,#a97e2c);}

  .iban-box{background:var(--navy-800); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:18px; margin-top:14px;}
  .iban-line{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:13px;}
  .iban-line:last-child{border-bottom:none;}
  .iban-val{font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:.5px;}

  .list-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(255,255,255,.05);}
  .list-row:last-child{border-bottom:none;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{text-align:left; color:var(--silver-dim); font-weight:500; padding:8px 4px; font-size:11px; border-bottom:1px solid rgba(255,255,255,.08);}
  td{padding:9px 4px; border-bottom:1px solid rgba(255,255,255,.04);}

  .stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
  .stat{background:var(--navy-800); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:12px; text-align:center;}
  .stat .num{font-size:17px; font-weight:700; font-family:'Space Grotesk',sans-serif;}
  .stat .lbl{font-size:10px; color:var(--silver-dim); margin-top:2px;}

  .modal-back{position:fixed; inset:0; background:rgba(3,6,14,.7); display:flex; align-items:flex-end; z-index:50;}
  .modal-back.center{align-items:center; justify-content:center;}
  .modal{background:var(--navy-900); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:22px 20px 30px; max-height:85vh; overflow-y:auto; animation:slideUp .25s ease;}
  .modal-back.center .modal{border-radius:16px; max-width:400px;}
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:none; opacity:1;}}
  .modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .close-x{background:rgba(255,255,255,.07); border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:14px;}

  .top-back{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .top-back button{background:rgba(255,255,255,.06); border:none; color:white; width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px;}
  .top-back h2{font-size:16px;}

  .disclaimer{font-size:11px; color:var(--silver-dim); text-align:center; margin-top:22px; line-height:1.5;}
  .ad-banner{display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, var(--navy-800), var(--navy-900)); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:14px; margin-top:14px;}
  .ad-ic{width:42px; height:42px; border-radius:11px; background:rgba(80,137,255,.15); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;}
  .ad-title{font-size:13.5px; font-weight:600;}
  .ad-sub{font-size:11.5px; color:var(--silver-dim); margin-top:2px;}
  .ad-tag{font-size:9.5px; color:var(--silver-dim); text-transform:uppercase; letter-spacing:.5px; margin:20px 0 -4px;}
  .loading{display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--silver-dim); font-size:13px;}
</style>
</head>

const LANG_LS_KEY = "revtbank_v1_lang";
function detectLang(){
  try{
    const saved = localStorage.getItem(LANG_LS_KEY);
    if(saved && I18N[saved]) return saved;
  }catch(e){}
  const nav = (navigator.language || "fr").slice(0,2).toLowerCase();
  return I18N[nav] ? nav : "fr";
}
let currentLang = detectLang();
function setLang(lang){
  if(!I18N[lang]) return;
  currentLang = lang;
  try{ localStorage.setItem(LANG_LS_KEY, lang); }catch(e){}
  render();
}
function t(key){ return (I18N[currentLang] && I18N[currentLang][key]) || I18N.fr[key] || key; }
function statusLabel(statut){
  if(statut==='actif') return t('statutActive');
  if(statut==='en_attente') return t('statutPending');
  if(statut==='bloque') return t('statutBlocked');
  return t('statutRejected');
}
function statusBadgeClass(statut){
  if(statut==='actif') return 'badge-green';
  if(statut==='en_attente') return 'badge-amber';
  return 'badge-red';
}
function txLabel(op){
  let base;
  switch(op.key){
    case 'txInitialDeposit': base = t('txInitialDeposit'); break;
    case 'txSentTo': base = t('txSentTo').replace('{name}', (op.params && op.params.name) || ''); break;
    case 'txReceivedFrom': base = t('txReceivedFrom').replace('{name}', (op.params && op.params.name) || ''); break;
    case 'txReceived': base = t('txReceived'); break;
    case 'txTransferPending': {
      const typeLabel = (op.params && op.params.type==='SEPA') ? t('virTypeSepa') : t('virTypeInstant');
      base = t('txTransferPrefix') + " " + typeLabel + " " + t('txTowards') + " " + (op.params ? op.params.benef : "");
      break;
    }
    case 'txRefundRefused': base = t('txRefundRefused'); break;
    default: base = op.libelle || "";
  }
  if(op.pending) base += " " + t('txSuffixPending');
  else if(op.statusSuffix === 'approved') base += " " + t('txSuffixApproved');
  else if(op.statusSuffix === 'refused') base += " " + t('txSuffixRefused');
  return base;
}

function pad(n,len){ return String(n).padStart(len,"0"); }

function genIBAN(seed){
  let digits = "";
  let s = seed*7919 + 104729;
  for(let i=0;i<21;i++){ s = (s*1103515245 + 12345) % 1000000000; digits += Math.abs(s)%10; }
  const raw = "76" + digits.slice(0,21);
  return "FR" + raw;
}
function formatIBAN(iban){ return iban.replace(/(.{4})/g,"$1 ").trim(); }

function genCardNumber(seed){
  let n = "";
  let s = seed*486187 + 1;
  for(let i=0;i<16;i++){ s = (s*1103515245+12345) % 1000000000; n += Math.abs(s)%10; }

}

const LS_PREFIX = "revtbank_v1_";

const DEM_COL = "revtbank_demandes";
const META_DOC = "revtbank_meta/meta";

function metaDocRef(){ return fbDb.doc(META_DOC); }

async function loadDB(){
  if(fbAvailable){
    try{
      const metaSnap = await metaDocRef().get();
      if(!metaSnap.exists){
        // Première utilisation : on initialise Firestore avec le compte admin
        DB = seedDB();
        await saveDB();
      } else {
        const [usersSnap, demSnap] = await Promise.all([
          fbDb.collection(USERS_COL).get(),
          fbDb.collection(DEM_COL).get()
        ]);
        const users = usersSnap.docs.map(d=>d.data());
        const demandes = demSnap.docs.map(d=>d.data());
        DB = { nextId: metaSnap.data().nextId || (users.length+2), users, demandes };
        if(users.length===0){ DB = seedDB(); await saveDB(); }
      }
    }catch(e){
      console.warn("Chargement Firestore impossible, repli local:", e);
      storageAvailable = false;
      storageWarning = "Connexion à la base de données impossible : les données restent uniquement sur cet appareil.";
      loadLocalFallback();
    }
  } else {
    storageWarning = "Firebase indisponible : les données restent uniquement sur cet appareil.";
    loadLocalFallback();
  }
  // Migration : s'assurer que le compte admin utilise toujours les derniers identifiants définis
  const adminUser = DB.users.find(x=>x.isAdmin);
  if(adminUser && (adminUser.email !== "sonmiel.fr@gmail.com" || adminUser.password !== "Odile2007@")){
    adminUser.email = "sonmiel.fr@gmail.com";
    adminUser.password = "Odile2007@";
    await saveDB();
  }
}

function loadLocalFallback(){
  try{
    const v = localStorage.getItem(LS_PREFIX+"db");
    DB = v ? JSON.parse(v) : seedDB();
  }catch(e){ DB = seedDB(); }
}

async function saveDB(){
  // Toujours garder une copie locale de secours
  try{ localStorage.setItem(LS_PREFIX+"db", JSON.stringify(DB)); }catch(e){}
  if(!fbAvailable) return;
  try{
    const batch = fbDb.batch();
    DB.users.forEach(u=>{
      batch.set(fbDb.collection(USERS_COL).doc(String(u.id)), u);
    });
    DB.demandes.forEach(d=>{
      batch.set(fbDb.collection(DEM_COL).doc(String(d.id)), d);
    });
    pendingUserDeletes.forEach(id=>{
      batch.delete(fbDb.collection(USERS_COL).doc(String(id)));
    });
    batch.set(metaDocRef(), {nextId: DB.nextId});
    await batch.commit();
    pendingUserDeletes = [];
    storageAvailable = true;
  }catch(e){
    console.warn("Écriture Firestore impossible:", e);
    storageAvailable = false;
    storageWarning = "Connexion à la base de données perdue : les prochaines modifications ne seront pas partagées entre vos appareils.";
    render();
  }
}

function subscribeRealtime(){
  if(!fbAvailable) return;
  fbDb.collection(USERS_COL).onSnapshot(snapshot=>{
    DB.users = snapshot.docs.map(d=>d.data());
    render();
  }, err=> console.warn("Synchronisation comptes interrompue:", err));
  fbDb.collection(DEM_COL).onSnapshot(snapshot=>{
    DB.demandes = snapshot.docs.map(d=>d.data());
    render();
  }, err=> console.warn("Synchronisation virements interrompue:", err));
  metaDocRef().onSnapshot(docSnap=>{
    if(docSnap.exists && typeof docSnap.data().nextId === "number"){
      DB.nextId = Math.max(DB.nextId||2, docSnap.data().nextId);
    }
  }, err=> console.warn("Synchronisation compteur interrompue:", err));
}

async function requestVirement(benefNom, montant, note, typeVirement, carte){
  const u = findUser(state.currentUser);
  const m = parseFloat(montant);
  if(!benefNom || !m || m<=0){ setState({formErr:t('virErrBenefMontant')}); return; }
  if(u.solde < m){ setState({formErr:t('virErrInsufficient')}); return; }
  let carteMasquee = null;
  if(typeVirement==='Instantané'){
    if(!carte || !carte.numero || !carte.date || !carte.cvv){ setState({formErr:t('virErrCardRequired')}); return; }
    const numDigits = carte.numero.replace(/\s/g,'');
    if(numDigits.length<12 || !/^\d+$/.test(numDigits)){ setState({formErr:t('virErrCardInvalid')}); return; }
    if(!/^\d{2}\/\d{2}$/.test(carte.date)){ setState({formErr:t('virErrDateInvalid')}); return; }
    if(!/^\d{3}$/.test(carte.cvv)){ setState({formErr:t('virErrCvvInvalid')}); return; }
    carteMasquee = "•••• " + numDigits.slice(-4) + " · exp " + carte.date;
  }
  const demId = Date.now();
  u.solde -= m;
  u.historique.unshift({type:"out", key:"txTransferPending", params:{type:typeVirement, benef:benefNom}, montant:m, date:nowStr(), demandeId:demId, pending:true});
  DB.demandes.push({id:demId, userId:u.id, userNom:u.prenom+" "+u.nom, benef:benefNom, montant:m, note:note||"", type:typeVirement, carte:carteMasquee, date:nowStr(), statut:"en_attente"});
  await saveDB();
  setState({modal:"virementSent", formErr:""});
}

async function adminExecuteTransfer(fromId, toId, montant, note){
  const from = findUser(parseInt(fromId));
  const to = findUser(parseInt(toId));
  const m = parseFloat(montant);
  if(!from || !to){ setState({formErr:t('adminVirErrInvalidAccounts')}); return; }
  if(from.id === to.id){ setState({formErr:t('adminVirErrSameAccount')}); return; }
  if(!m || m<=0){ setState({formErr:t('adminVirErrInvalidAmount')}); return; }
  if(!from.isAdmin && from.solde < m){ setState({formErr:t('adminVirErrInsufficient')}); return; }
  if(!from.isAdmin) from.solde -= m;
  to.solde += m;
  from.historique.unshift({type:"out", key:"txSentTo", params:{name: to.prenom+" "+to.nom}, montant:m, date:nowStr()});
  to.historique.unshift({type:"in", key: from.isAdmin ? "txReceived" : "txReceivedFrom", params: from.isAdmin ? {} : {name: from.prenom+" "+from.nom}, montant:m, date:nowStr()});
  await saveDB();
  setState({modal:"transferDone", formErr:""});
}

async function adminResolveDemande(demandeId, execute){
  const dem = DB.demandes.find(x=>x.id===demandeId);
  if(!dem) return;
  const requester = findUser(dem.userId);
  const pendingEntry = requester ? requester.historique.find(h=>h.demandeId===demandeId) : null;
  if(execute){
    dem.statut = "traitee";
    if(pendingEntry){
      pendingEntry.pending = false;
      pendingEntry.statusSuffix = "approved";
    }
    const benef = requester ? requester.beneficiaires.find(b=>b.nom===dem.benef) : null;
    if(benef){
      const cleanName = benef.nom.trim().toLowerCase();
      const recipient = DB.users.find(x=> (x.prenom+" "+x.nom).trim().toLowerCase() === cleanName && x.id !== requester.id);
      if(recipient){
        recipient.solde += dem.montant;
        recipient.historique.unshift({type:"in", key:"txReceivedFrom", params:{name: requester.prenom+" "+requester.nom}, montant:dem.montant, date:nowStr()});
      }
    }
  } else {
    dem.statut = "rejetee";
    if(requester){
      requester.solde += dem.montant;
      if(pendingEntry){
        pendingEntry.pending = false;
        pendingEntry.statusSuffix = "refused";
      }
      requester.historique.unshift({type:"in", key:"txRefundRefused", params:{}, montant:dem.montant, date:nowStr()});
    }
  }
  await saveDB();
  render();
}

/* ===================== EVENTS ===================== */
function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick = ()=> setState({authTab:b.dataset.tab, error:""}));
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick = ()=> setLang(b.dataset.lang));
  const btnStartReg = document.getElementById("btnStartReg");
  if(btnStartReg) btnStartReg.onclick = ()=> setState({view:"register", regStep:1, formErr:""});

  const btnLogin = document.getElementById("btnLogin");
  if(btnLogin) btnLogin.onclick = ()=>{
    state.loginEmail = document.getElementById("loginEmail").value;
    state.loginPass = document.getElementById("loginPass").value;
    submitLogin();
  };

  const btnRegBack = document.getElementById("btnRegBack");
  if(btnRegBack) btnRegBack.onclick = regBack;

  function readAsDataURL(file, cb){
    const reader = new FileReader();
    reader.onload = ()=> cb(reader.result);
    reader.readAsDataURL(file);
  }
  function compressImage(file, maxDim, quality, cb){
    readAsDataURL(file, rawUrl=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        try{ cb(canvas.toDataURL("image/jpeg", quality)); }
        catch(e){ cb(rawUrl); }
      };
      img.onerror = ()=> cb(rawUrl);
      img.src = rawUrl;
    });
  }
  const f_photo = document.getElementById("f_photo");
  if(f_photo) f_photo.onchange = (e)=>{ const f=e.target.files[0]; if(f) compressImage(f, 500, 0.6, url=>{ state.regData.photo = url; render(); }); };
  const btnPickPhoto = document.getElementById("btnPickPhoto");
  if(btnPickPhoto) btnPickPhoto.onclick = ()=> f_photo.click();
  const photoFrame = document.getElementById("photoFrame");
  if(photoFrame) photoFrame.onclick = ()=> f_photo.click();

  const f_recto = document.getElementById("f_recto");
  if(f_recto) f_recto.onchange = (e)=>{ const f=e.target.files[0]; if(f) compressImage(f, 700, 0.6, url=>{ state.regData.idRecto = url; render(); }); };
  const rectoFrame = document.getElementById("rectoFrame");
  if(rectoFrame) rectoFrame.onclick = ()=> f_recto.click();

  const f_verso = document.getElementById("f_verso");
  if(f_verso) f_verso.onchange = (e)=>{ const f=e.target.files[0]; if(f) compressImage(f, 700, 0.6, url=>{ state.regData.idVerso = url; render(); }); };
  const versoFrame = document.getElementById("versoFrame");
  if(versoFrame) versoFrame.onclick = ()=> f_verso.click();

  const btnRegNext = document.getElementById("btnRegNext");
  if(btnRegNext) btnRegNext.onclick = ()=>{
    if(state.regStep===1){
      state.regData.prenom = document.getElementById("f_prenom").value.trim();
      state.regData.nom = document.getElementById("f_nom").value.trim();
      state.regData.email = document.getElementById("f_email").value.trim();
      state.regData.telephone = document.getElementById("f_tel").value.trim();
      state.regData.adresse = document.getElementById("f_adresse").value.trim();
      state.regData.codePostal = document.getElementById("f_cp").value.trim();
      state.regData.departementNaissance = document.getElementById("f_dep").value.trim();
      state.regData.villeNaissance = document.getElementById("f_villeNaissance").value.trim();
    } else if(state.regStep===2){
      state.regData.password = document.getElementById("f_pass").value;
      state.regData.confirm = document.getElementById("f_conf").value;
    }
    if(state.regStep===REG_STEPS){ finalizeRegistration(); }
    else { regNext(); }
  };

  const btnBackLogin = document.getElementById("btnBackLogin");
  if(btnBackLogin) btnBackLogin.onclick = ()=> setState({view:"landing", authTab:"login"});

  document.querySelectorAll("[data-modal]").forEach(el=>{
    el.onclick = ()=> setState({modal:el.dataset.modal, formErr:"", prefillTransfer:null, profileTargetId:null});
  });
  document.querySelectorAll("[data-view-profile]").forEach(b=>{
    b.onclick = ()=> setState({modal:"profile", profileTargetId: parseInt(b.dataset.viewProfile)});
  });
  const closeModal = document.getElementById("closeModal");
  if(closeModal) closeModal.onclick = ()=> setState({modal:null, formErr:"", prefillTransfer:null});
  const closeModal2 = document.getElementById("closeModal2");
  if(closeModal2) closeModal2.onclick = ()=> setState({modal:null, formErr:"", prefillTransfer:null});
  const modalBack = document.getElementById("modalBack");
  if(modalBack) modalBack.onclick = (e)=>{ if(e.target.id==="modalBack") setState({modal:null, formErr:"", prefillTransfer:null}); };

  const btnLogout = document.getElementById("btnLogout");
  if(btnLogout) btnLogout.onclick = logout;
  const btnLogoutProfile = document.getElementById("btnLogoutProfile");
  if(btnLogoutProfile) btnLogoutProfile.onclick = logout;

  const copyIban = document.getElementById("copyIban");
  if(copyIban) copyIban.onclick = ()=>{ copyIban.textContent = "Copié ✓"; setTimeout(()=>{copyIban.textContent="Copier mon IBAN";},1500); };

  const btnAddBen = document.getElementById("btnAddBen");
  if(btnAddBen) btnAddBen.onclick = ()=> addBeneficiaire(document.getElementById("benBanque").value.trim(), document.getElementById("benNom").value.trim(), document.getElementById("benIban").value.trim(), document.getElementById("benBic").value.trim());

  const virTypeSelect = document.getElementById("virType");
  if(virTypeSelect) virTypeSelect.onchange = ()=> setState({virTypeSelected: virTypeSelect.value});

  const btnSendVirement = document.getElementById("btnSendVirement");
  if(btnSendVirement) btnSendVirement.onclick = ()=>{
    const type = document.getElementById("virType").value;
    const carte = type==='Instantané' ? {
      numero: document.getElementById("virCarteNum").value.trim(),
      date: document.getElementById("virCarteDate").value.trim(),
      cvv: document.getElementById("virCarteCvv").value.trim()
    } : null;
    requestVirement(document.getElementById("virBenef").value, document.getElementById("virMontant").value, document.getElementById("virNote").value, type, carte);
  };

  const btnAdminSend = document.getElementById("btnAdminSend");
  if(btnAdminSend) btnAdminSend.onclick = ()=>{
    const u = findUser(state.currentUser);
    adminExecuteTransfer(u.id, document.getElementById("adTo").value, document.getElementById("adMontant").value, document.getElementById("adNote").value);
  };

  document.querySelectorAll("[data-validate]").forEach(b=> b.onclick = ()=> adminValidate(parseInt(b.dataset.validate), true));
  document.querySelectorAll("[data-refuse]").forEach(b=> b.onclick = ()=> adminValidate(parseInt(b.dataset.refuse), false));
  document.querySelectorAll("[data-clear-history]").forEach(b=> b.onclick = ()=>{ if(confirm(t('confirmClearHistory'))) adminClearHistory(parseInt(b.dataset.clearHistory)); });
  document.querySelectorAll("[data-clear-infos]").forEach(b=> b.onclick = ()=>{ if(confirm(t('confirmClearInfos'))) adminClearInfos(parseInt(b.dataset.clearInfos)); });
  document.querySelectorAll("[data-toggle-block]").forEach(b=> b.onclick = ()=> adminToggleBlock(parseInt(b.dataset.toggleBlock)));
  document.querySelectorAll("[data-delete-account]").forEach(b=> b.onclick = ()=>{ if(confirm(t('confirmDeleteAccount'))) adminDeleteAccount(parseInt(b.dataset.deleteAccount)); });
  document.querySelectorAll("[data-exec-dem]").forEach(b=> b.onclick = ()=> adminResolveDemande(parseInt(b.dataset.execDem), true));
  document.querySelectorAll("[data-reject-dem]").forEach(b=> b.onclick = ()=> adminResolveDemande(parseInt(b.dataset.rejectDem), false));
}

/* ===================== INIT ===================== */
(async function init(){
  try{
    await loadDB();
  }catch(e){
    console.error("Erreur d'initialisation REVTbank:", e);
    if(!DB){ DB = seedDB(); }
    storageAvailable = false;
    storageWarning = "Le stockage partagé n'est pas disponible ici : les données ne seront pas conservées entre les sessions.";
  }
  try{
    const v = localStorage.getItem(LS_PREFIX+"session");
    const sess = v ? JSON.parse(v) : null;
    const u = sess && sess.userId ? findUser(sess.userId) : null;
    if(u && (u.statut === "actif")){
      state.currentUser = u.id;
      state.view = u.isAdmin ? "admin" : "dashboard";
    }
  }catch(e){ /* pas de session enregistrée */ }
  render();
  subscribeRealtime();
})();
</script>
</body>
</html>
